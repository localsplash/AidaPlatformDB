# Local development only: a throwaway MySQL whose empty volume the MySQL image
# loads from init/. Real environments bring their own MySQL and run
# compose.yaml's one-shots against it instead.
#
#   docker compose -f compose.dev.yaml up -d
#
# then run the same one-shots a real environment runs (ledger baseline and
# app users) on its network:
#
#   ECHO_DB_NETWORK=echo-db-dev ECHO_DB_HOST=echo-database \
#     MYSQL_ADMIN_PASSWORD=devroot ECHO_WEB_DB_PASSWORD=devweb \
#     ECHO_SERVICE_DB_PASSWORD=devservice docker compose up
name: echo-database-dev

services:
  echo-database:
    image: mysql:8.4
    container_name: echo-database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: echo_db
    volumes:
      - echo_database_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  echo_database_data:

networks:
  default:
    name: echo-db-dev
